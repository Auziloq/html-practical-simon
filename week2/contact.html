<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon KC | Contact</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>Contact Simon</h1>
    </header>
    <nav aria-label="Portfolio navigation"><a href="index.html">Home</a><a href="about.html">About</a><a
            href="contact.html">Contact</a></nav>
    <main>
        <section>
            <h2>Send a Message</h2>
            <form action="#" method="post">
                <p><label for="contact-name">Name:</label><input id="contact-name" name="name" type="text" required></p>
                <p><label for="contact-email">Email:</label><input id="contact-email" name="email" type="email"
                        required></p>
                <p><label for="message">Message:</label><br><textarea id="message" name="message" rows="6" cols="45"
                        required></textarea></p><button type="submit">Send Message</button>
            </form>
        </section>
        <section>
            <h2>Find My College</h2><iframe src="https://www.google.com/maps?q=PCPS+College,+Kupondole&amp;output=embed"
                width="600" height="450" title="Map of PCPS College, Kupondole"></iframe>
        </section>
    </main>
    <footer>
        <p><a href="mailto:simon.kc@example.com">simon.kc@example.com</a></p>
        <p>&copy; 2026 Simon KC</p>
    </footer>
