<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Media Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="profile.png" type="image/png">
    <style>
        h1 {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>
<body>
    <h1>My Media Hub</h1>

    <h2>YouTube Video</h2>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/Aq5WXmQQooo?si=QldiuOkNOT_bXGZK" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ?si=nHozrd9sYD2xX1e0" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    <h2>Local Video</h2>
    <video controls width="560">
        <source src="media/sample-video.mp4" type="video/mp4">
        <source src="media/sample-video.webm" type="video/webm">
        Your browser does not support the video tag.
    </video>

    <h2>Audio Clip</h2>
    <audio controls>
        <source src="media/sample-audio.mp3" type="audio/mpeg">
        Your browser does not support the audio tag.
    </audio>

    <h2>Google Map</h2>
    <iframe src="https://www.google.com/maps?q=PCPS%20College%20Kupondole&output=embed" width="600" height="450" title="PCPS College map"></iframe>

    <h2>External Webpage</h2>
    <iframe src="https://www.example.com" width="600" height="250" title="External webpage"></iframe>

    <h2>PDF File</h2>
    <embed src="media/sample-document.pdf" type="application/pdf" width="600" height="400">
</body>
</html>
