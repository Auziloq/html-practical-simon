<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>

<body>
    <h1>Student Registration Form</h1>
    <form action="#" method="post">
        <p><label for="name">Name:</label> <input type="text" id="name" name="name" required></p>
        <p><label for="email">Email:</label> <input type="email" id="email" name="email" required></p>
        <p><label for="password">Password:</label> <input type="password" id="password" name="password" required></p>
        <fieldset>
            <legend>Gender</legend>
            <label><input type="radio" name="gender" value="female"> Female</label>
            <label><input type="radio" name="gender" value="male"> Male</label>
            <label><input type="radio" name="gender" value="other"> Other</label>
        </fieldset>
        <fieldset>
            <legend>Interests</legend>
            <label><input type="checkbox" name="interests" value="coding"> Coding</label>
            <label><input type="checkbox" name="interests" value="music"> Music</label>
            <label><input type="checkbox" name="interests" value="sports"> Sports</label>
        </fieldset>
        <p><label for="department">Department:</label>
            <select id="department" name="department">
                <option value="software-engineering">Software Engineering</option>
                <option value="business">Business</option>
            </select>
        </p>
        <p><label for="about">About You:</label><br><textarea id="about" name="about"></textarea></p>
        <button type="submit">Submit Registration</button>
    </form>
</body>

</html>
